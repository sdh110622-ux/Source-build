name: Build ESP Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          unzip "Free Src iOS By;SAQER.zip" -d MyESP
          echo "=== Contents ==="
          ls -la MyESP/
          EXTRACTED=$(ls MyESP/ | head -1)
          echo "EXTRACTED_DIR=$EXTRACTED" >> $GITHUB_ENV
          echo "Found: $EXTRACTED"

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          rsync -a /tmp/sdks/iPhoneOS*.sdk $HOME/theos/sdks/

      - name: Install Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git /tmp/Dobby
          cd /tmp/Dobby && mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_C_COMPILER=$(xcrun --sdk iphoneos --find clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun --sdk iphoneos --find clang++) \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            -DDOBBY_DEBUG=OFF
          make -j$(sysctl -n hw.ncpu)
          cp $(find . -name "*.a" | head -1) $HOME/theos/lib/libdobby.a
          cp /tmp/Dobby/include/dobby.h $HOME/theos/include/

      - name: Detect Structure
        run: |
          BASE="MyESP/${{ env.EXTRACTED_DIR }}"
          echo "BASE=$BASE" >> $GITHUB_ENV
          echo "=== Base Structure ==="
          ls -la "$BASE"

          INCLUDES=$(find "$BASE" -name "Includes.h" | head -1)
          echo "INCLUDES_PATH=$INCLUDES" >> $GITHUB_ENV
          echo "Includes.h: $INCLUDES"

          ESP_DIR=$(find "$BASE" -type d -name "ESP" | head -1)
          echo "ESP_DIR=$ESP_DIR" >> $GITHUB_ENV
          echo "ESP: $ESP_DIR"

          KITTY_DIR=$(find "$BASE" -type d -name "KittyMemory" | head -1)
          echo "KITTY_DIR=$KITTY_DIR" >> $GITHUB_ENV
          echo "KittyMemory: $KITTY_DIR"

          SDK_DIR=$(find "$BASE" -type d -name "SDK" | head -1)
          echo "SDK_DIR=$SDK_DIR" >> $GITHUB_ENV
          echo "SDK: $SDK_DIR"

      - name: Fix Includes
        run: |
          INCLUDES="${{ env.INCLUDES_PATH }}"
          if [ -f "$INCLUDES" ]; then
            sed -i '' 's/#define LOGD.*//g' "$INCLUDES"
            sed -i '' 's/#define LOGE.*//g' "$INCLUDES"
            sed -i '' 's/#define LOGI.*//g' "$INCLUDES"
            sed -i '' 's/#define LOGW.*//g' "$INCLUDES"
            sed -i '' 's/#include.*android_log.*//g' "$INCLUDES"
            echo "Fixed OK"
          else
            echo "Includes.h nahi mila — skipping"
          fi

      - name: Fix Makefile
        run: |
          BASE="${{ env.BASE }}"
          ESP="${{ env.ESP_DIR }}"
          KITTY="${{ env.KITTY_DIR }}"
          SDK="${{ env.SDK_DIR }}"

          echo "Writing Makefile to: $BASE/Makefile"

          cat > "$BASE/Makefile" << EOF
          TARGET = iphone:clang:latest:14.0
          ARCHS = arm64
          DEBUG = 0
          FINALPACKAGE = 1

          include \$(THEOS)/makefiles/common.mk

          TWEAK_NAME = ESP

          ESP_FILES = \$(wildcard $ESP/*.mm) \\
                      \$(wildcard $ESP/*.cpp) \\
                      \$(wildcard $ESP/imgui/*.mm) \\
                      \$(wildcard $ESP/imgui/*.cpp) \\
                      \$(wildcard $KITTY/*.cpp) \\
                      \$(wildcard $SDK/*.cpp)

          ESP_FRAMEWORKS = IOKit UIKit Foundation Security \\
                           QuartzCore CoreGraphics CoreText \\
                           AVFoundation Accelerate GLKit \\
                           SystemConfiguration GameController \\
                           Metal MetalKit

          ESP_CCFLAGS = -w -std=gnu++17 -fno-rtti -fno-exceptions \\
                        -O2 -ffunction-sections -fdata-sections \\
                        -DNDEBUG -Wno-module-import-in-extern-c \\
                        -I\$(THEOS_PROJECT_DIR) \\
                        -I$ESP \\
                        -I$ESP/imgui \\
                        -I$KITTY \\
                        -I$SDK

          ESP_CFLAGS = -w -fobjc-arc \\
                       -Wno-deprecated-declarations \\
                       -Wno-unused-variable \\
                       -Wno-unused-value

          ESP_LDFLAGS = -ldobby -Wl,-dead_strip

          include \$(THEOS_MAKE_PATH)/tweak.mk
          EOF

          echo "=== Makefile ==="
          cat "$BASE/Makefile"

      - name: Install ldid
        run: brew install ldid

      - name: Build Dylib
        run: |
          cd "${{ env.BASE }}"
          make clean
          make 2>&1

      - name: Find Dylib
        run: |
          mkdir -p /tmp/output
          find MyESP -name "*.dylib" -exec cp {} /tmp/output/ \;
          echo "=== Output ==="
          ls -la /tmp/output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP-dylib
          path: /tmp/output/
          if-no-files-found: warn
