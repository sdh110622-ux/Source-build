name: Build ESP Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Source
        run: |
          unzip "Free Src iOS By;SAQER.zip" -d MyESP

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          rsync -a /tmp/sdks/iPhoneOS*.sdk $HOME/theos/sdks/

      - name: Install Dobby
        run: |
          git clone https://github.com/jmpews/Dobby.git /tmp/Dobby
          cd /tmp/Dobby && mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_C_COMPILER=$(xcrun --sdk iphoneos --find clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun --sdk iphoneos --find clang++) \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_OSX_SYSROOT=$(xcrun --sdk iphoneos --show-sdk-path) \
            -DDOBBY_DEBUG=OFF
          make -j$(sysctl -n hw.ncpu)
          cp $(find . -name "*.a" | head -1) $HOME/theos/lib/libdobby.a
          cp /tmp/Dobby/include/dobby.h $HOME/theos/include/

      - name: Fix Includes
        run: |
          cd MyESP
          sed -i '' 's/#define LOGD.*//g' ESP/Includes.h
          sed -i '' 's/#define LOGE.*//g' ESP/Includes.h
          sed -i '' 's/#define LOGI.*//g' ESP/Includes.h
          sed -i '' 's/#define LOGW.*//g' ESP/Includes.h
          sed -i '' 's/#include.*android_log.*//g' ESP/Includes.h

      - name: Fix Makefile
        run: |
          cd MyESP
          cat > Makefile << 'EOF'
          TARGET = iphone:clang:latest:14.0
          ARCHS = arm64
          DEBUG = 0
          FINALPACKAGE = 1

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ESP

          ESP_FILES = $(wildcard ESP/*.mm) \
                      $(wildcard ESP/*.cpp) \
                      $(wildcard ESP/imgui/*.mm) \
                      $(wildcard ESP/imgui/*.cpp) \
                      $(wildcard KittyMemory/*.cpp) \
                      $(wildcard SDK/*.cpp)

          ESP_FRAMEWORKS = IOKit UIKit Foundation Security \
                           QuartzCore CoreGraphics CoreText \
                           AVFoundation Accelerate GLKit \
                           SystemConfiguration GameController \
                           Metal MetalKit

          ESP_CCFLAGS = -w -std=gnu++17 -fno-rtti -fno-exceptions \
                        -O2 -ffunction-sections -fdata-sections \
                        -DNDEBUG -Wno-module-import-in-extern-c \
                        -I$(THEOS_PROJECT_DIR) \
                        -I$(THEOS_PROJECT_DIR)/ESP \
                        -I$(THEOS_PROJECT_DIR)/ESP/imgui \
                        -I$(THEOS_PROJECT_DIR)/KittyMemory \
                        -I$(THEOS_PROJECT_DIR)/SDK

          ESP_CFLAGS = -w -fobjc-arc \
                       -Wno-deprecated-declarations \
                       -Wno-unused-variable \
                       -Wno-unused-value

          ESP_LDFLAGS = -ldobby -Wl,-dead_strip

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

      - name: Install ldid
        run: brew install ldid

      - name: Build Dylib
        run: |
          cd MyESP
          make clean
          make 2>&1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: ESP-dylib
          path: |
            MyESP/.theos/obj/
            MyESP/packages/
          if-no-files-found: warn

