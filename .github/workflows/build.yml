name: Build ESP Dylib

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Source
        run: |
          ls -la
          unzip "Free Src iOS By;SAQER.zip" -d MyESP
          ls MyESP
          
      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
            - name: Install SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/sdks
          ls /tmp/sdks/
          rsync -a /tmp/sdks/iPhoneOS*.sdk $HOME/theos/sdks/
          ls $HOME/theos/sdks/

          
      - name: Fix Includes
        run: |
          cd MyESP
          # Android log macros fix
          sed -i '' 's/#define LOGD.*//g' ESP/Includes.h
          sed -i '' 's/#define LOGE.*//g' ESP/Includes.h
          sed -i '' 's/#define LOGI.*//g' ESP/Includes.h
          sed -i '' 's/#define LOGW.*//g' ESP/Includes.h
          sed -i '' 's/#include.*android_log.*//g' ESP/Includes.h
          
      - name: Fix Makefile
        run: |
          cd MyESP
          cat > Makefile << 'EOF'
          TARGET = iphone:clang:latest:14.0
          ARCHS = arm64
          DEBUG = 0
          FINALPACKAGE = 1

          include $(THEOS)/makefiles/common.mk

          TWEAK_NAME = ESP

          ESP_FILES = $(wildcard ESP/*.mm) \
                      $(wildcard ESP/*.cpp) \
                      $(wildcard ESP/imgui/*.mm) \
                      $(wildcard ESP/imgui/*.cpp) \
                      $(wildcard KittyMemory/*.cpp) \
                      $(wildcard SDK/*.cpp)

          ESP_FRAMEWORKS = IOKit UIKit Foundation Security \
                           QuartzCore CoreGraphics CoreText \
                           AVFoundation Accelerate GLKit \
                           SystemConfiguration GameController \
                           Metal MetalKit

          ESP_CCFLAGS = -w -std=gnu++17 -fno-rtti -fno-exceptions \
                        -DNDEBUG -Wno-module-import-in-extern-c \
                        -I$(THEOS_PROJECT_DIR) \
                        -I$(THEOS_PROJECT_DIR)/ESP \
                        -I$(THEOS_PROJECT_DIR)/ESP/imgui \
                        -I$(THEOS_PROJECT_DIR)/KittyMemory \
                        -I$(THEOS_PROJECT_DIR)/SDK

          ESP_CFLAGS = -w -fobjc-arc \
                       -Wno-deprecated-declarations \
                       -Wno-unused-variable \
                       -Wno-unused-value

          ESP_LDFLAGS = -ldobby

          include $(THEOS_MAKE_PATH)/tweak.mk
          EOF

      - name: Build Dylib
        run: |
          cd MyESP
          make clean
          make 2>&1
          
      - name: Find Dylib
        run: |
          echo "=== Searching for dylib ==="
          find MyESP -name "*.dylib" 2>/dev/null
          mkdir -p /tmp/output
          find MyESP -name "*.dylib" -exec cp {} /tmp/output/ \;
          ls -la /tmp/output/
          
      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: ESP-dylib
          path: /tmp/output/
          if-no-files-found: warn
